services:
  postgres:
    image: postgres:16
    container_name: sweety_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sweety_redis
    ports:
      - "6379:6379"

  server:
    build: ./server
    container_name: sweety_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/sweety_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=sweety_secret_key_123
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - postgres
      - redis

  client:
    build: ./client
    container_name: sweety_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  postgres_data:
